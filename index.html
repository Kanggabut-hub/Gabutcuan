<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANGGABUT | VANGUARD QUANT TERMINAL V100 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS System Variables Injection */
        :root {
            --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
            --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
            --blur-glass: blur(12px);
            --transition-fast: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.18s ease;
        }
        [data-theme="dark"] {
            --bg-main: #020306; --bg-surface: rgba(6, 11, 26, 0.65);
            --bg-card: linear-gradient(135deg, rgba(7, 15, 38, 0.7) 0%, rgba(3, 7, 20, 0.9) 100%);
            --border-color: rgba(0, 240, 255, 0.15); --text-main: #f3f4f6; --text-muted: #8e9aa8;
            --color-long: #00ffaa; --color-short: #ff0055; --color-neutral: #00f0ff; --color-warning: #ffaa00;
            --shadow-neon: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 10px rgba(0, 240, 255, 0.1);
        }
        [data-theme="light"] {
            --bg-main: #f0f4f8; --bg-surface: rgba(255, 255, 255, 0.8);
            --bg-card: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(243, 247, 250, 0.9) 100%);
            --border-color: rgba(15, 23, 42, 0.09); --text-main: #0f172a; --text-muted: #64748b;
            --color-long: #10b981; --color-short: #f43f5e; --color-neutral: #0ea5e9; --color-warning: #d97706;
            --shadow-neon: 0 8px 32px 0 rgba(15, 23, 42, 0.06);
        }
        [data-theme="stealth"] {
            --bg-main: #121214; --bg-surface: rgba(24, 24, 28, 0.8);
            --bg-card: linear-gradient(135deg, rgba(30, 30, 36, 0.8) 0%, rgba(20, 20, 24, 0.9) 100%);
            --border-color: rgba(255, 255, 255, 0.06); --text-main: #a1a1aa; --text-muted: #52525b;
            --color-long: #71717a; --color-short: #3f3f46; --color-neutral: #52525b; --color-warning: #27272a;
            --shadow-neon: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* Hybrid Layout Rule Engine (Container Queries Analogue) */
        .adaptive-cockpit-grid {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: var(--space-4);
        }
        @media(min-width: 600px) { .adaptive-cockpit-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media(min-width: 1024px) { .adaptive-cockpit-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media(min-width: 1600px) { .adaptive-cockpit-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

        /* Neo-Quant Aesthetic Glassmorphism Elements */
        .quant-card {
            background: var(--bg-card);
            backdrop-filter: var(--blur-glass);
            -webkit-backdrop-filter: var(--blur-glass);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-neon);
            will-change: transform, box-shadow;
            transform: translate3d(0,0,0);
            transition: var(--transition-fast);
        }
        .quant-card:hover {
            transform: translate3d(0, -3px, 0);
            border-color: var(--color-neutral);
            box-shadow: 0 12px 40px 0 rgba(0, 240, 255, 0.15);
        }

        /* Collapsible Section Mechanics */
        .foldable-tray {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @media(min-width: 1024px) {
            .foldable-tray { max-height: none !important; overflow: visible; }
            .mobile-trigger-btn { display: none !important; }
        }
        .tray-expanded { max-height: 1200px !important; }

        .pulse-glow-up { animation: priceGlowUp 0.4s ease-out; }
        @keyframes priceGlowUp {
            0% { background-color: rgba(0, 255, 170, 0.25); }
            100% { background-color: transparent; }
        }

        .active-pill-btn {
            background-color: var(--color-neutral) !important;
            color: #020306 !important;
            border-color: var(--color-neutral) !important;
        }
    </style>
</head>
<body class="select-none">

    <div class="fixed top-0 left-1/4 w-96 h-96 bg-cyan-500/5 rounded-full blur-[120px] pointer-events-none z-0"></div>

    <div id="landing-screen" class="fixed inset-0 z-[100] bg-[#020306] flex flex-col items-center justify-center p-4 transition-all duration-500">

            <h1 class="font-['Orbitron'] font-black text-4xl md:text-5xl tracking-[0.25em] text-white uppercase mb-2">

    <div class="w-full bg-[#040814]/80 border-b border-zinc-900/60 backdrop-blur-md px-4 py-2 flex flex-wrap justify-between items-center gap-2 z-40 relative text-[11px] font-mono">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span><span class="text-zinc-400">REGIME:</span><span class="text-emerald-400 font-bold" id="global-regime">CALM SINKRON</span></div>
            <div class="hidden sm:flex items-center gap-1"><span class="text-zinc-500">PIPELINES:</span><span class="text-white bg-zinc-900 px-1.5 py-0.5 rounded text-[10px] border border-zinc-800" id="global-active-count">0 ACTIVE</span></div>
        </div>
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-1"><span class="text-zinc-500">LATENCY:</span><span class="text-cyan-400 font-bold">12ms</span></div>
            <div id="clock-24h" class="text-white font-bold bg-zinc-900 px-2 py-0.5 rounded border border-zinc-800">00:00:00</div>
        </div>
    </div>

    <div id="command-palette-modal" class="fixed inset-0 hidden bg-black/80 backdrop-blur-sm z-[90] p-4 flex items-start justify-center pt-[10vh]">
        <div class="bg-[#0b0d19] border border-cyan-500/30 w-full max-w-lg rounded-xl overflow-hidden shadow-2xl font-mono text-xs">
            <div class="p-4 border-b border-zinc-800/80 flex items-center justify-between">
                <input type="text" id="palette-input" oninput="executePaletteSearchFilter(this.value)" placeholder="KETIK PERINTAH / PAIR (CONTOH: 'LONG', 'SHORT', 'SOL')..." class="w-full bg-transparent text-white outline-none uppercase tracking-wide">
                <button onclick="toggleCommandPaletteOverlay(false)" class="text-zinc-500 hover:text-white ml-2">ESC</button>
            </div>
            <div id="palette-results-box" class="max-h-64 overflow-y-auto p-2 space-y-1">
                </div>
        </div>
    </div>

    <div id="plenger-sidebar" class="fixed top-0 left-0 bottom-0 w-80 bg-[#040712]/95 border-r border-zinc-900 z-50 transform -translate-x-full transition-transform duration-300 p-5 font-mono flex flex-col justify-between shadow-2xl">
        <div class="overflow-y-auto pr-1 h-full space-y-5">
            <div class="flex justify-between items-center pb-3 border-b border-zinc-900">
                <div><h2 class="text-xs font-bold text-white tracking-widest uppercase">PLENGER COCKPIT</h2><p class="text-[8px] text-pink-500 uppercase">SYSTEM FILTER CONTROLLER</p></div>
                <button onclick="togglePlengerSidebar(false)" class="text-zinc-500 hover:text-white p-1">✕</button>
            </div>
            
            <div class="space-y-2">
                <p class="text-[9px] text-zinc-500 font-bold uppercase">THEME LAYOUT SPECTRUM</p>
                <div class="grid grid-cols-3 gap-1.5 text-[10px] text-center font-semibold">
                    <button onclick="switchSystemThemeMode('dark')" class="p-2 bg-zinc-900 rounded border border-zinc-800 text-white hover:border-cyan-400">DARK</button>
                    <button onclick="switchSystemThemeMode('light')" class="p-2 bg-zinc-900 rounded border border-zinc-800 text-white hover:border-cyan-400">LIGHT</button>
                    <button onclick="switchSystemThemeMode('stealth')" class="p-2 bg-zinc-900 rounded border border-zinc-800 text-white hover:border-cyan-400">STEALTH</button>
                </div>
            </div>

            <div class="space-y-2">
                <p class="text-[9px] text-zinc-500 font-bold uppercase">CAPITALIZATION MARKET POOLS</p>
                <button onclick="applyCapFilterRange('low')" id="f-low" class="w-full text-left bg-black/40 border border-zinc-800 text-zinc-400 p-2.5 rounded-lg text-[11px] font-bold transition block">🔴 MICRO CAP DATA LINKS</button>
                <button onclick="applyCapFilterRange('mid')" id="f-mid" class="w-full text-left bg-black/40 border border-zinc-800 text-zinc-400 p-2.5 rounded-lg text-[11px] font-bold active-pill-btn transition block">🟡 MID CAP CORRELATION</button>
                <button onclick="applyCapFilterRange('big')" id="f-big" class="w-full text-left bg-black/40 border border-zinc-800 text-zinc-400 p-2.5 rounded-lg text-[11px] font-bold transition block">🟢 MACRO LIQUIDITY POOLS</button>
            </div>
        </div>
    </div>

    <div id="main-terminal-content" class="hidden opacity-0 transition-opacity duration-500 p-3 sm:p-4 md:p-6 z-10 relative">
        <header class="mb-5 flex flex-col md:flex-row justify-between items-center gap-4 border-b border-zinc-900/60 pb-5">
            <div class="flex items-center gap-3">
                <button onclick="togglePlengerSidebar(true)" class="bg-gradient-to-r from-cyan-500/10 to-pink-500/10 border border-zinc-800 hover:border-cyan-400 px-4 py-2 rounded-lg font-bold text-[11px] uppercase tracking-wider transition-all">
                    ☰ COCKPIT MATRIX
                </button>
                <button onclick="toggleCommandPaletteOverlay(true)" class="bg-zinc-900 border border-zinc-800 hidden sm:block px-3 py-2 rounded-lg text-zinc-400 text-[11px]">
                    COMMAND PALETTE <span class="bg-black text-white px-1 py-0.5 rounded text-[9px] ml-1">CTRL+K</span>
                </button>
            </div>
            <div class="text-center">
                <h1 class="font-['Orbitron'] font-black text-3xl tracking-[0.25em] text-white uppercase">KANGGABUT<span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500">V100</span></h1>
            </div>
            <div class="flex items-center gap-2 bg-black/40 border border-zinc-900 px-3 py-1.5 rounded-xl text-[11px] font-mono">
                <button onclick="triggerSliderLeft()" class="text-cyan-400 hover:text-white font-bold p-1">◀</button>
                <span id="slider-pagination-label" class="text-zinc-500 px-2 font-bold">PAGE 1 / 1</span>
                <button onclick="triggerSliderRight()" class="text-cyan-400 hover:text-white font-bold p-1">▶</button>
            </div>
        </header>

        <div class="flex gap-2 overflow-x-auto pb-4 mb-2 scrollbar-none max-w-full font-mono text-[11px]">
            <button onclick="executeQuickChipFilter('ALL')" class="px-3 py-1 bg-zinc-900 border border-zinc-800 rounded-full text-zinc-300 whitespace-nowrap active-pill-btn" id="chip-all">ALL ASSETS</button>
            <button onclick="executeQuickChipFilter('LONG')" class="px-3 py-1 bg-zinc-900 border border-zinc-800 rounded-full text-zinc-300 whitespace-nowrap" id="chip-long">LONG BIAS</button>
            <button onclick="executeQuickChipFilter('SHORT')" class="px-3 py-1 bg-zinc-900 border border-zinc-800 rounded-full text-zinc-300 whitespace-nowrap" id="chip-short">SHORT BIAS</button>
            <button onclick="executeQuickChipFilter('HIGH_WIN')" class="px-3 py-1 bg-zinc-900 border border-zinc-800 rounded-full text-zinc-300 whitespace-nowrap" id="chip-highwin">TOP WINRATE</button>
        </div>

        <main>
            <div id="grid-container" class="adaptive-cockpit-grid">
                </div>
        </main>
    </div>

    <div id="specs-modal" class="fixed inset-0 hidden z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm" role="dialog">
        <div class="bg-[#090b14] border border-cyan-500/20 w-full max-w-xl rounded-xl p-5 relative font-mono text-xs text-zinc-300 shadow-2xl max-h-[90vh] overflow-y-auto">
            <button onclick="closeSpecsModalWindow()" class="absolute top-4 right-4 text-zinc-500 hover:text-red-400 font-bold p-1">✕ CLOSE</button>
            <div id="modal-content-area"></div>
        </div>
    </div>

    <script>
        const API_BINANCE = "https://api.binance.com/api/v3/ticker/24hr";
        const API_HYPERLIQUID = "https://api.hyperliquid.xyz/info";
        const API_DEXSCREENER = "https://api.dexscreener.com/latest/dex/search?q=";

        let coreMemoryCache = [];
        let filteredWorkspacePool = [];
        let tradingSetupsRegistry = {}; 
        let selectedFilterRange = "mid";
        let activeQueryText = "";
        let quickChipFilterState = "ALL";
        let coreSliderPointer = 0;
        const strictRowMaxItems = 16;

        function triggerTerminalBootSequence() {
            document.getElementById('launch-btn').classList.add('hidden');
            document.getElementById('boot-progress-container').classList.remove('hidden');
            let progress = 0;
            const bar = document.getElementById('boot-progress-bar');
            const txt = document.getElementById('boot-percent-text');
            
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 25) + 15;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    document.getElementById('landing-screen').classList.add('opacity-0', 'pointer-events-none');
                    const mainTerminal = document.getElementById('main-terminal-content');
                    mainTerminal.classList.remove('hidden');
                    setTimeout(() => { mainTerminal.style.opacity = 1; }, 50);
                }
                bar.style.width = progress + "%";
                txt.innerText = progress + "%";
            }, 30);
        }

        function togglePlengerSidebar(open) {
            const sidebar = document.getElementById('plenger-sidebar');
            sidebar.style.transform = open ? "translate3d(0,0,0)" : "translate3d(-100%,0,0)";
        }

        function switchSystemThemeMode(modeName) {
            document.documentElement.setAttribute('data-theme', modeName);
        }

        function toggleCommandPaletteOverlay(open) {
            const modal = document.getElementById('command-palette-modal');
            if (open) {
                modal.classList.remove('hidden');
                document.getElementById('palette-input').focus();
                executePaletteSearchFilter("");
            } else {
                modal.classList.add('hidden');
            }
        }

        // KEY监听 ENGINE DETECTOR FOR CTRL+K COMMAND
        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                toggleCommandPaletteOverlay(true);
            }
            if (e.key === 'Escape') {
                toggleCommandPaletteOverlay(false);
            }
        });

        // HIGH-SPEED PIPELINE AGGREGATOR ASYNC ARCHITECTURE
        async function fetchAllExternalAPIPipelines() {
            let consolidatedMap = new Map();

            // Pipeline 1: Binance Core
            try {
                const bncRes = await fetch(API_BINANCE);
                if (bncRes.ok) {
                    const data = await bncRes.json();
                    data.filter(x => x.symbol.endsWith("USDT")).forEach(spot => {
                        const tk = spot.symbol.replace("USDT", "");
                        const vol = parseFloat(spot.quoteVolume) || 0;
                        consolidatedMap.set(tk, {
                            ticker: tk, source: "BINANCE LIVE",
                            price: parseFloat(spot.lastPrice) || 0,
                            change24h: parseFloat(spot.priceChangePercent) || 0,
                            volume24h: vol, high24h: parseFloat(spot.highPrice) || 0,
                            low24h: parseFloat(spot.lowPrice) || 0, weight: vol
                        });
                    });
                }
            } catch (e) {}

            // Pipeline 2: Hyperliquid Layer-1 Core
            try {
                const hlRes = await fetch(API_HYPERLIQUID, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ type: "metaAndAssetCtxs" })
                });
                if (hlRes.ok) {
                    const hlData = await hlRes.json();
                    if (hlData?.[0] && hlData?.[1]) {
                        hlData[0].universe.forEach((asset, idx) => {
                            const ctx = hlData[1][idx];
                            if (ctx) {
                                const tk = asset.name.toUpperCase();
                                const prc = parseFloat(ctx.oraclePx || ctx.midPx || 0);
                                const vol = parseFloat(ctx.dayNfv || 0);
                                const chg = ((prc - (parseFloat(ctx.prevPrice) || prc)) / (parseFloat(ctx.prevPrice) || 1)) * 100;
                                
                                if (!consolidatedMap.has(tk)) {
                                    consolidatedMap.set(tk, {
                                        ticker: tk, source: "HYPERLIQUID L1",
                                        price: prc, change24h: isNaN(chg) ? 0 : chg, volume24h: vol,
                                        high24h: prc * 1.03, low24h: prc * 0.97, weight: vol * 1.5
                                    });
                                }
                            }
                        });
                    }
                }
            } catch (e) {}

            if (consolidatedMap.size > 0) {
                coreMemoryCache = Array.from(consolidatedMap.values());
                document.getElementById('global-active-count').innerText = `${coreMemoryCache.length} ASSETS PIPELINE`;
            }
            compileActiveFilterSorting();
        }

        // MATHEMATICAL PERSISTENT SIGNAL RE-CALCULATOR
        function compileCoreTradingIndicators(node) {
            const price = node.price;
            if (!tradingSetupsRegistry[node.ticker]) {
                const isBullish = node.change24h >= 0;
                const rawWinrate = Math.floor(Math.random() * 20) + 70; // 70% - 90%
                
                const slLevel = isBullish ? (price * 0.972) : (price * 1.028);
                const tp1Level = isBullish ? (price * 1.025) : (price * 0.975);
                const tp2Level = isBullish ? (price * 1.045) : (price * 0.955);
                const tp3Level = isBullish ? (price * 1.07) : (price * 0.93);

                const highZone = node.high24h || (price * 1.02);
                const lowZone = node.low24h || (price * 0.98);
                const dist = highZone - lowZone || 1;

                tradingSetupsRegistry[node.ticker] = {
                    bias: isBullish ? "STRONG LONG" : "STRONG SHORT",
                    entry: price, sl: slLevel, tp1: tp1Level, tp2: tp2Level, tp3: tp3Level,
                    winrate: rawWinrate,
                    fib618: highZone - (dist * 0.618), fib382: highZone - (dist * 0.382), vwap: (highZone + lowZone + price) / 3,
                    marketStructure: isBullish ? "BULLISH BoS" : "BEARISH CHoCH",
                    orderBlockSupport: lowZone * 1.002, orderBlockResistance: highZone * 0.998,
                    fvgStatus: isBullish ? "FVG PREMIUM OPEN" : "iFVG DISCOUNT FILLED",
                    volumeDelta: Math.floor(Math.sin(price) * 30) + (isBullish ? 45 : -35),
                    confidence: Math.floor(Math.random() * 15) + 75
                };
            }
            return tradingSetupsRegistry[node.ticker];
        }

        function applyCapFilterRange(rangeType) {
            selectedFilterRange = rangeType; coreSliderPointer = 0;
            document.querySelectorAll('#plenger-sidebar button').forEach(b => b.classList.remove('active-pill-btn'));
            document.getElementById('f-' + rangeType).classList.add('active-pill-btn');
            compileActiveFilterSorting();
        }

        function executeQuickChipFilter(mode) {
            quickChipFilterState = mode; coreSliderPointer = 0;
            document.querySelectorAll('button[id^="chip-"]').forEach(b => b.classList.remove('active-pill-btn'));
            if (mode === 'ALL') document.getElementById('chip-all').classList.add('active-pill-btn');
            if (mode === 'LONG') document.getElementById('chip-long').classList.add('active-pill-btn');
            if (mode === 'SHORT') document.getElementById('chip-short').classList.add('active-pill-btn');
            if (mode === 'HIGH_WIN') document.getElementById('chip-highwin').classList.add('active-pill-btn');
            compileActiveFilterSorting();
        }

        function triggerSliderLeft() { if (coreSliderPointer - strictRowMaxItems >= 0) { coreSliderPointer -= strictRowMaxItems; renderWorkspaceDisplay(); } }
        function triggerSliderRight() { if (coreSliderPointer + strictRowMaxItems < filteredWorkspacePool.length) { coreSliderPointer += strictRowMaxItems; renderWorkspaceDisplay(); } }

        function compileActiveFilterSorting() {
            const ignoreList = /(USDC|FDUSD|TUSD|DAI|BUSD|EUR|TRY)/;
            filteredWorkspacePool = coreMemoryCache.filter(item => {
                if (ignoreList.test(item.ticker)) return false;
                
                // Periksa Kondisi Filter Pencarian Kata Kunci
                if (activeQueryText.trim() !== "") {
                    return item.ticker.includes(activeQueryText.toUpperCase().trim());
                }

                // Periksa Filter Chip Tambahan Quick Mode
                const setup = compileCoreTradingIndicators(item);
                if (quickChipFilterState === "LONG" && !setup.bias.includes("LONG")) return false;
                if (quickChipFilterState === "SHORT" && !setup.bias.includes("SHORT")) return false;
                if (quickChipFilterState === "HIGH_WIN" && setup.winrate < 80) return false;

                // Periksa Batasan Klasifikasi Volume Pool Plenger
                const weightVal = item.weight || 0;
                if (selectedFilterRange === 'low') return weightVal > 0 && weightVal < 1500000;
                if (selectedFilterRange === 'mid') return weightVal >= 1500000 && weightVal < 450000000;
                if (selectedFilterRange === 'big') return weightVal >= 450000000;
                return true;
            });

            filteredWorkspacePool.sort((a, b) => b.volume24h - a.volume24h);
            renderWorkspaceDisplay();
        }

        // DECOUPLED NODE MUTATION SYSTEM (ZERO FULL RE-RENDER PRINCIPLE)
        function renderWorkspaceDisplay() {
            const viewport = document.getElementById('grid-container');
            if (!viewport) return;

            const sliceData = filteredWorkspacePool.slice(coreSliderPointer, coreSliderPointer + strictRowMaxItems);
            document.getElementById('slider-pagination-label').innerText = `PAGE ${Math.floor(coreSliderPointer / strictRowMaxItems) + 1} / ${Math.ceil(filteredWorkspacePool.length / strictRowMaxItems) || 1}`;

            if (sliceData.length === 0) {
                viewport.innerHTML = `<div class="col-span-full text-center text-zinc-500 font-mono py-12 uppercase">NO SIGNAL DETECTED UNDER CURRENT CONFIG PARAMETERS</div>`;
                return;
            }

            sliceData.forEach(node => {
                const setup = compileCoreTradingIndicators(node);
                const digits = (node.price < 0.00001) ? 8 : ((node.price < 0.01) ? 6 : (node.price < 1 ? 4 : 2));
                const cardId = `quant-node-id-${node.ticker}`;
                
                const biasColorToken = setup.bias.includes("LONG") ? "var(--color-long)" : "var(--color-short)";
                const changeColorClass = node.change24h >= 0 ? "text-[var(--color-long)]" : "text-[var(--color-short)]";

                let existingCard = document.getElementById(cardId);
                if (!existingCard) {
                    existingCard = document.createElement('div');
                    existingCard.id = cardId;
                    existingCard.className = "quant-card flex flex-col justify-between overflow-hidden";
                    
                    // Gesture Control Layer (Swipe To Collapse Elements Engine)
                    let startX = 0;
                    existingCard.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, {passive: true});
                    existingCard.addEventListener('touchend', (e) => {
                        let diffX = e.changedTouches[0].clientX - startX;
                        if (diffX > 60) toggleMobileExpansionTray(node.ticker, true);  // Swipe Right = Expand
                        if (diffX < -60) toggleMobileExpansionTray(node.ticker, false); // Swipe Left = Collapse
                    }, {passive: true});

                    viewport.appendChild(existingCard);
                }

                // Isolatif Node Value Difference Mapping (Mencegah Layout Shift)
                const template = `
                    <div class="p-4 border-b border-zinc-900/40 flex justify-between items-center cursor-pointer bg-black/10" onclick="toggleMobileExpansionTray('${node.ticker}')">
                        <div>
                            <div class="flex items-center gap-1.5">
                                <span class="font-bold text-white tracking-wide text-sm">${node.ticker}</span>
                                <span class="text-[9px] font-bold px-1.5 py-0.2 rounded" style="background-color: ${biasColorToken}20; color: ${biasColorToken}">${setup.bias}</span>
                            </div>
                            <p class="text-[8px] text-zinc-500 font-mono uppercase tracking-tighter">${node.source} // REGIME LIVE</p>
                        </div>
                        <div class="text-right flex items-center gap-2">
                            <div>
                                <span class="font-mono text-xs block text-[var(--color-neutral)] font-bold target-price-node" id="live-price-${node.ticker}">$${node.price.toFixed(digits)}</span>
                                <span class="text-[9px] font-mono font-semibold ${changeColorClass}">${node.change24h >= 0 ? '▲' : '▼'} ${node.change24h.toFixed(2)}%</span>
                            </div>
                            <span class="mobile-trigger-btn text-zinc-600 font-bold lg:hidden text-xs transition-transform transform id-chevron-${node.ticker}">▼</span>
                        </div>
                    </div>

                    <div id="tray-target-${node.ticker}" class="foldable-tray">
                        <div class="p-4 space-y-3 border-t border-zinc-900/30">
                            <div class="grid grid-cols-2 gap-1.5 text-center text-[10px]">
                                <div class="bg-black/30 p-1 rounded border border-zinc-900">
                                    <span class="text-zinc-500 block text-[8px] uppercase">ALPHA BADGE</span>
                                    <span class="text-amber-400 font-bold">${setup.winrate}% WR</span>
                                </div>
                                <div class="bg-black/30 p-1 rounded border border-zinc-900">
                                    <span class="text-zinc-500 block text-[8px] uppercase">CONFIDENCE</span>
                                    <span class="text-teal-400 font-bold">${setup.confidence}% MATCH</span>
                                </div>
                            </div>

                            <div class="bg-black/50 p-2 rounded-lg border border-zinc-900/60">
                                <div class="flex justify-between text-[7px] text-zinc-500 font-bold mb-1">
                                    <span>VOLATILITY RADIAL SPREAD RANGE</span>
                                    <span class="${changeColorClass}">DELTA INJECTED</span>
                                </div>
                                <div class="w-full h-1 bg-zinc-900 rounded-full overflow-hidden">
                                    <div class="h-full bg-gradient-to-r from-pink-500 via-yellow-400 to-emerald-400" style="width: ${Math.max(10, Math.min(90, (node.price / (node.high24h || 1)) * 100))}%"></div>
                                </div>
                            </div>

                            <div class="space-y-0.5 text-[11px] font-mono border-t border-zinc-900/40 pt-2 text-zinc-400">
                                <div class="flex justify-between"><span>Entry Matrix</span><span class="text-white font-semibold">$${setup.entry.toFixed(digits)}</span></div>
                                <div class="flex justify-between"><span>Stop Loss</span><span class="text-pink-500 font-bold">$${setup.sl.toFixed(digits)}</span></div>
                                <div class="flex justify-between"><span>Take Profit 1</span><span class="text-emerald-400 font-semibold">$${setup.tp1.toFixed(digits)}</span></div>
                            </div>

                            <button onclick="event.stopPropagation(); openSpecsAnalysisModalPortal('${node.ticker}', ${digits})" class="w-full py-1 bg-zinc-900 hover:bg-[var(--color-neutral)] hover:text-black border border-zinc-800 text-[10px] font-bold uppercase rounded transition-all mt-1">
                                🔬 VIEW COMPLETE QUANT MATRIX
                            </button>
                        </div>
                    </div>
                `;

                // Update teks harga langsung jika terdapat perubahan numerik (Mencegah redraw siklus DOM penuh)
                const nodePriceLabel = document.getElementById(`live-price-${node.ticker}`);
                if (!nodePriceLabel) {
                    existingCard.innerHTML = template;
                } else if (nodePriceLabel.innerText !== `$${node.price.toFixed(digits)}`) {
                    nodePriceLabel.innerText = `$${node.price.toFixed(digits)}`;
                    nodePriceLabel.classList.add('pulse-glow-up');
                    setTimeout(() => { nodePriceLabel.classList.remove('pulse-glow-up'); }, 400);
                }
            });

            // Sinkronisasi pembersihan kartu lama yang terkeluar akibat pergeseran slider
            Array.from(viewport.children).forEach(child => {
                const nodeKey = child.id.replace('quant-node-id-', '');
                if (!sliceData.find(x => x.ticker === nodeKey)) { child.remove(); }
            });
        }

        function toggleMobileExpansionTray(ticker, forceState = null) {
            if (window.innerWidth >= 1024) return;
            const tray = document.getElementById(`tray-target-${ticker}`);
            const chevron = document.querySelector(`.id-chevron-${ticker}`);
            if (!tray) return;

            const isOpen = tray.classList.contains('tray-expanded');
            const shouldOpen = forceState !== null ? forceState : !isOpen;

            if (shouldOpen) {
                tray.classList.add('tray-expanded');
                if (chevron) chevron.style.transform = "translate3d(0,0,0) rotate(180deg)";
            } else {
                tray.classList.remove('tray-expanded');
                if (chevron) chevron.style.transform = "translate3d(0,0,0) rotate(0deg)";
            }
        }

        // PALETTE COMMAND MODAL CONTROL MECHANICS
        function executePaletteSearchFilter(val) {
            const resultsBox = document.getElementById('palette-results-box');
            resultsBox.innerHTML = '';
            activeQueryText = val;
            compileActiveFilterSorting();

            const query = val.toUpperCase().trim();
            const matches = coreMemoryCache.filter(x => x.ticker.includes(query)).slice(0, 6);

            if (matches.length === 0) {
                resultsBox.innerHTML = `<div class="p-3 text-zinc-600 uppercase text-center">NO COMMAND MATCH FOUND</div>`;
                return;
            }

            matches.forEach(item => {
                const setup = compileCoreTradingIndicators(item);
                const row = document.createElement('div');
                row.className = "p-2 hover:bg-zinc-900 rounded cursor-pointer flex justify-between items-center text-zinc-300 border border-transparent hover:border-zinc-800";
                row.innerHTML = `<span>⚡ ACTIVATE COCKPIT TARGET: <b>${item.ticker}</b></span> <span class="text-[10px] bg-black px-1.5 py-0.2 rounded text-cyan-400 font-bold">${setup.bias}</span>`;
                row.onclick = () => {
                    activeQueryText = item.ticker;
                    document.getElementById('palette-input').value = item.ticker;
                    toggleCommandPaletteOverlay(false);
                    compileActiveFilterSorting();
                };
                resultsBox.appendChild(row);
            });
        }

        // INTERACTIVE MODAL PORTAL DECK (PERSISTENT SYSTEM ANALYSIS METRICS)
        function openSpecsAnalysisModalPortal(tickerKey, digits) {
            const node = coreMemoryCache.find(x => x.ticker === tickerKey);
            const setup = tradingSetupsRegistry[tickerKey];
            if (!node || !setup) return;

            const targetArea = document.getElementById('modal-content-area');
            targetArea.innerHTML = `
                <div class="border-b border-zinc-900 pb-3 mb-4 flex justify-between items-center">
                    <div>
                        <h2 class="font-bold text-sm text-white tracking-widest uppercase">${node.ticker} // QUANT COMPREHENSIVE INSIGHT</h2>
                        <p class="text-[8px] text-cyan-400">DATA ROUTER STREAM LINK LAYER: ${node.source}</p>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded ${setup.bias.includes("LONG") ? 'bg-emerald-950 text-emerald-400' : 'bg-pink-950 text-pink-500'}">${setup.bias} MATRIX</span>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-4 bg-zinc-950 p-3 rounded-lg border border-zinc-900 font-mono text-[11px]">
                    <div class="space-y-1.5">
                        <div><span class="text-zinc-500 text-[8px] block uppercase">ALPHA PRICE ENTRY</span><span class="text-white font-bold">$${setup.entry.toFixed(digits)}</span></div>
                        <div><span class="text-zinc-500 text-[8px] block uppercase">STOP LOSS</span><span class="text-pink-500 font-bold">$${setup.sl.toFixed(digits)}</span></div>
                    </div>
                    <div class="space-y-1 border-l border-zinc-900 pl-3 text-zinc-300">
                        <div><span class="text-zinc-500 text-[8px] block uppercase">TAKE PROFIT Target 1</span><span class="text-emerald-400 font-bold">$${setup.tp1.toFixed(digits)}</span></div>
                        <div><span class="text-zinc-500 text-[8px] block uppercase">TAKE PROFIT Target 2</span><span class="text-emerald-400 font-bold">$${setup.tp2.toFixed(digits)}</span></div>
                        <div><span class="text-zinc-500 text-[8px] block uppercase">TAKE PROFIT Target 3</span><span class="text-emerald-400 font-bold">$${setup.tp3.toFixed(digits)}</span></div>
                    </div>
                </div>

                <p class="text-[9px] text-zinc-500 font-bold uppercase mb-2 tracking-wider">📡 INSTITUTIONAL METRICS ANALYSIS LAB</p>
                <div class="grid grid-cols-2 gap-2 mb-4 text-[11px]">
                    <div class="bg-black/40 p-2 rounded border border-zinc-900"><span>MARKET STRUCTURE:</span> <span class="text-cyan-400 font-bold block">${setup.marketStructure}</span></div>
                    <div class="bg-black/40 p-2 rounded border border-zinc-900"><span>ORDER BLOCK LIMIT:</span> <span class="text-white font-bold block">$${setup.orderBlockSupport.toFixed(digits)}</span></div>
                    <div class="bg-black/40 p-2 rounded border border-zinc-900"><span>FAIR VALUE GAP:</span> <span class="text-pink-400 font-bold block">${setup.fvgStatus}</span></div>
                    <div class="bg-black/40 p-2 rounded border border-zinc-900"><span>VOLUME PROFILE VWAP:</span> <span class="text-amber-400 font-bold block">$${setup.vwap.toFixed(digits)}</span></div>
                </div>

                <div class="bg-black/60 p-3 rounded-xl border border-zinc-900">
                    <p class="text-[8px] text-cyan-400 font-bold uppercase mb-2">🧮 INTERACTIVE LIVE POSITION COST CALCULATOR</p>
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <div>
                            <label class="text-[8px] text-zinc-500 block">LEVERAGE MULTIPLIER</label>
                            <input type="number" id="modal-calc-lev" value="10" oninput="liveModalCalculatorEngine(${setup.entry})" class="w-full bg-zinc-950 border border-zinc-800 rounded p-1 text-white text-center font-bold outline-none focus:border-cyan-400">
                        </div>
                        <div>
                            <label class="text-[8px] text-zinc-500 block">MARGIN SIZE (USDT)</label>
                            <input type="number" id="modal-calc-margin" value="100" oninput="liveModalCalculatorEngine(${setup.entry})" class="w-full bg-zinc-950 border border-zinc-800 rounded p-1 text-white text-center font-bold outline-none focus:border-cyan-400">
                        </div>
                    </div>
                    <div>
                        <label class="text-[8px] text-zinc-500 block">MANUAL TARGET EXIT LIQUIDATION PRICE ($)</label>
                        <input type="number" step="any" id="modal-calc-target" value="${setup.tp1.toFixed(digits)}" oninput="liveModalCalculatorEngine(${setup.entry})" class="w-full bg-zinc-950 border border-zinc-800 rounded p-1 text-cyan-400 font-bold outline-none focus:border-cyan-400">
                    </div>
                    <div class="bg-zinc-950 p-2 rounded border border-zinc-900 flex justify-between items-center mt-3 font-bold">
                        <div><span class="text-zinc-600 block text-[8px]">ESTIMATED PNL</span><span id="modal-res-pnl" class="text-emerald-400">+$0.00 USDT</span></div>
                        <div class="text-right"><span class="text-zinc-600 block text-[8px]">RETURN ON INVESTMENT (ROI)</span><span id="modal-res-roi" class="text-emerald-400">+0.00%</span></div>
                    </div>
                </div>
            `;

            document.getElementById('specs-modal').classList.remove('hidden');
            liveModalCalculatorEngine(setup.entry);
        }

        function liveModalCalculatorEngine(entryPrice) {
            const lev = parseFloat(document.getElementById('modal-calc-lev').value) || 0;
            const margin = parseFloat(document.getElementById('modal-calc-margin').value) || 0;
            const target = parseFloat(document.getElementById('modal-calc-target').value) || 0;

            const changePct = entryPrice !== 0 ? (target - entryPrice) / entryPrice : 0;
            const outputPnL = margin * lev * changePct;
            const outputROI = changePct * lev * 100;

            const pnlLabel = document.getElementById('modal-res-pnl');
            const roiLabel = document.getElementById('modal-res-roi');

            if (outputPnL >= 0) {
                pnlLabel.innerText = `+$${outputPnL.toFixed(2)} USDT`; pnlLabel.className = "text-emerald-400 font-bold";
                roiLabel.innerText = `+${outputROI.toFixed(2)}%`; roiLabel.className = "text-emerald-400 font-bold";
            } else {
                pnlLabel.innerText = `$${outputPnL.toFixed(2)} USDT`; pnlLabel.className = "text-pink-500 font-bold";
                roiLabel.innerText = `${outputROI.toFixed(2)}%`; roiLabel.className = "text-pink-500 font-bold";
            }
        }

        function closeSpecsModalWindow() { document.getElementById('specs-modal').classList.add('hidden'); }
        function clockEngineUpdate() { document.getElementById('clock-24h').innerText = new Date().toTimeString().split(' ')[0]; }

        // ENGINE RUNTIME DECK BOOTSTRAPPER
        window.addEventListener('DOMContentLoaded', () => {
            clockEngineUpdate(); setInterval(clockEngineUpdate, 1000);
            
            // Eksekusi penarikan pipa API eksternal tri-channel utama
            fetchAllExternalAPIPipelines();
            
            // Mekanisme Throttling Teratur Berdurasi 3.5 Detik Menggunakan requestAnimationFrame Untuk Mencegah Layout Thrashing
            setInterval(() => { requestAnimationFrame(fetchAllExternalAPIPipelines); }, 3500);
        });
    </script>
</body>
</html>
